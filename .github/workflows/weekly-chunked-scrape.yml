name: Weekly Chunked PESDB Scrape

on:
  schedule:
    - cron: "00 13 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      chunk_count: ${{ steps.manifest.outputs.chunk_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare chunks
        run: python pipeline_github.py prepare

      - name: Export matrix
        id: manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("output/chunks_manifest.json").read_text(encoding="utf-8"))
          matrix = {"include": [{"chunk_index": item["chunk_index"]} for item in manifest]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps(matrix)}\n")
              handle.write(f"chunk_count={len(manifest)}\n")
          PY

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            output/chunks_manifest.json
            output/chunks/ids_chunk_*.json
            output/player_ids.txt
            output/log_pagine.xlsx

  process-chunks:
    needs: prepare
    if: ${{ needs.prepare.outputs.chunk_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: output

      - name: Process chunk
        run: python pipeline_github.py process-chunk --chunk-index ${{ matrix.chunk_index }}

      - name: Stage chunk artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp output/chunks/players_chunk_*.json artifact/

      - name: Upload chunk result
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk_index }}
          path: artifact/

  merge:
    needs: [prepare, process-chunks]
    if: ${{ always() && needs.prepare.outputs.chunk_count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: output

      - name: Download all chunk results
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: output/chunks
          merge-multiple: true

      - name: Merge generated data
        shell: bash
        run: |
          python pipeline_github.py merge

          extraction_stamp="$(date -u +'%d_%m_%Y')"
          mkdir -p data
          cp output/pesdb_players_it.json data/pesdb_players_it.json
          cp output/pesdb_players_it.json "data/estrazione_${extraction_stamp}.json"
          cp output/pesdb_players_meta.json data/pesdb_players_meta.json
          cp output/pesdb_players_diff.json data/pesdb_players_diff.json
          cp output/pesdb_players_it.csv data/pesdb_players_it.csv

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesdb_players_it.json data/pesdb_players_meta.json data/pesdb_players_diff.json data/pesdb_players_it.csv data/estrazione_*.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update PESDB generated data"
            git push
          fi
