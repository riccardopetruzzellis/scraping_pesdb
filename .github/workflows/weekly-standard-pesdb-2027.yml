name: PESDB 2027 Standard Players

on:
  schedule:
    # GitHub Actions uses UTC. The gate below keeps the effective run at
    # 11:00 Europe/Rome across both daylight-saving time changes.
    - cron: "0 9,10 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo di aggiornamento"
        required: true
        default: "incremental"
        type: choice
        options: [incremental, full]
      max_pages:
        description: "Solo test: limita le pagine Standard (vuoto = tutte)"
        required: false
        type: string

permissions:
  contents: write

env:
  PESDB_2027_FORCE_FULL: ${{ github.event.inputs.mode == 'full' && '1' || '0' }}
  PESDB_2027_LIST_DELAY_SECONDS: "2.5"
  PESDB_2027_LIST_RETRIES: "3"
  PESDB_2027_RETRY_BASE_SECONDS: "15"
  PYTHONUNBUFFERED: "1"

jobs:
  scheduled_window:
    name: Check scheduled Italian time
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Rome date +%H)"
          if [ "$hour" = "11" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  prepare-discovery-plan:
    name: 1. Plan Standard player discovery
    needs: scheduled_window
    if: needs.scheduled_window.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Read pages and create ranges
        shell: bash
        run: |
          args=(prepare-discovery-plan --pages-per-shard 20)
          if [ -n "${{ inputs.max_pages }}" ]; then
            args+=(--max-pages "${{ inputs.max_pages }}")
          fi
          python pipeline_github_2027.py "${args[@]}"
      - name: Export discovery matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path("output/standard_2027_discovery_plan.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': plan['ranges']})}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pesdb-2027-discovery-plan
          path: output/standard_2027_discovery_plan.json

  discover-ranges:
    name: 2. Discover Standard player ranges
    needs: prepare-discovery-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.prepare-discovery-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect Standard player URLs for range
        run: >-
          python pipeline_github_2027.py discover-range
          --start-page ${{ matrix.start_page }}
          --end-page ${{ matrix.end_page }}
      - name: Stage range result
        shell: bash
        run: |
          mkdir -p artifact
          printf -v range_file 'standard_2027_pages_%04d_%04d.json' "${{ matrix.start_page }}" "${{ matrix.end_page }}"
          cp "output/discovery/${range_file}" artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: pesdb-2027-discovery-${{ matrix.start_page }}
          path: artifact/

  assemble-discovery:
    name: 3. Validate and assemble discovery
    needs: [prepare-discovery-plan, discover-ranges]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pesdb-2027-discovery-plan
          path: output
      - uses: actions/download-artifact@v4
        with:
          pattern: pesdb-2027-discovery-*
          path: output/discovery
          merge-multiple: true
      - name: Validate and build player chunks
        run: python pipeline_github_2027.py assemble-discovery --chunk-size 75
      - name: Publish discovery summary
        run: cat output/standard_2027_prepare_summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Export chunk matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("output/standard_2027_manifest.json").read_text())
          matrix = {"include": [{"chunk_index": item["chunk_index"]} for item in manifest]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pesdb-2027-prepared
          path: |
            output/standard_2027_manifest.json
            output/standard_2027_pages.json
            output/standard_2027_prepare_summary.json
            output/chunks_2027/standard_chunk_*.json

  process-chunks:
    name: 4. Scrape Standard player details
    needs: assemble-discovery
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.assemble-discovery.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pesdb-2027-prepared
          path: output
      - name: Scrape chunk
        run: python pipeline_github_2027.py process-chunk --chunk-index ${{ matrix.chunk_index }}
      - name: Stage result
        shell: bash
        run: |
          mkdir -p artifact
          printf -v chunk_file 'result_chunk_%03d.json' "${{ matrix.chunk_index }}"
          cp "output/chunks_2027/${chunk_file}" artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: pesdb-2027-result-${{ matrix.chunk_index }}
          path: artifact/

  merge:
    name: 5. Merge and publish
    needs: [assemble-discovery, process-chunks]
    if: >-
      always() && needs['assemble-discovery'].result == 'success' && needs['process-chunks'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pesdb-2027-prepared
          path: output
      - uses: actions/download-artifact@v4
        with:
          pattern: pesdb-2027-result-*
          path: output/chunks_2027
          merge-multiple: true
      - name: Merge quality-checked data
        run: python pipeline_github_2027.py merge
      - name: Copy generated data
        shell: bash
        run: |
          stamp="$(date -u +'%Y_%m_%d')"
          cp output/pesdb_players_it.json data/pesdb_players_it.json
          cp output/pesdb_players_it.csv data/pesdb_players_it.csv
          cp output/pesdb_players_meta.json data/pesdb_players_meta.json
          cp output/pesdb_players_diff.json data/pesdb_players_diff.json
          cp output/pesdb_2027_state.json data/pesdb_2027_state.json
          cp output/pesdb_players_it.json "data/estrazione_${stamp}.json"
      - name: Commit generated data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.max_pages == '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesdb_players_it.json data/pesdb_players_it.csv data/pesdb_players_meta.json data/pesdb_players_diff.json data/pesdb_2027_state.json data/estrazione_*.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update PESDB 2027 Standard players"
            git push
          fi
