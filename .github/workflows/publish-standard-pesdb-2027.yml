name: Publish Existing PESDB 2027 Results

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "ID del run PESDB 2027 Standard Players da pubblicare"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Merge and publish saved results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download prepared player list
        uses: actions/download-artifact@v4
        with:
          name: pesdb-2027-prepared
          path: output
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download saved scrape results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf downloaded-artifacts
          mkdir -p output/chunks_2027
          gh run download "${{ inputs.source_run_id }}" --repo "${{ github.repository }}" --dir downloaded-artifacts
          find downloaded-artifacts -type f -name 'result_chunk_*.json' -exec cp {} output/chunks_2027/ \;
          result_count="$(find output/chunks_2027 -type f -name 'result_chunk_*.json' | wc -l)"
          if [ "$result_count" -eq 0 ]; then
            echo "No saved chunk results were found in run ${{ inputs.source_run_id }}."
            exit 1
          fi
          echo "Recovered $result_count saved chunk results."
      - name: Merge quality-checked data
        run: python pipeline_github_2027.py merge
      - name: Copy generated data
        shell: bash
        run: |
          stamp="$(date -u +'%Y_%m_%d')"
          cp output/pesdb_players_it.json data/pesdb_players_it.json
          cp output/pesdb_players_it.csv data/pesdb_players_it.csv
          cp output/pesdb_players_meta.json data/pesdb_players_meta.json
          cp output/pesdb_players_diff.json data/pesdb_players_diff.json
          cp output/pesdb_2027_state.json data/pesdb_2027_state.json
          cp output/pesdb_players_it.json "data/estrazione_${stamp}.json"
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesdb_players_it.json data/pesdb_players_it.csv data/pesdb_players_meta.json data/pesdb_players_diff.json data/pesdb_2027_state.json data/estrazione_*.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Publish PESDB 2027 Standard results"
            git push
          fi
